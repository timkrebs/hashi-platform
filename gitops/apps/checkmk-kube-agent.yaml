# gitops/apps/checkmk-kube-agent.yaml
#
# Collectors that feed the Kubernetes special agent on the Checkmk host: a
# cluster collector for container metrics and a node collector DaemonSet for
# cAdvisor and machine sections.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkmk-kube-agent
  namespace: argocd
  annotations:
    # After the platform add-ons, independent of Vault.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://checkmk.github.io/checkmk_kube_agent
      chart: checkmk
      targetRevision: 1.12.1
      helm:
        releaseName: checkmk
        valueFiles:
          - $values/gitops/values/checkmk-kube-agent/values.yaml
    - repoURL: https://github.com/timkrebs/hashi-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: checkmk-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
