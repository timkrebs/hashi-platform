# gitops/apps/vault-secrets-operator.yaml
#
# Der Vault Secrets Operator holt Secrets aus Vault und legt sie als normale
# Kubernetes-Secrets im jeweiligen Namespace ab. Die Anwendungen sprechen damit
# gar nicht mehr mit Vault -- sie lesen ein gemountetes Secret.
#
# Sync-Wave 12: nach Vault selbst (10), vor den Anwendungen (20). Ohne
# laufenden Vault kann der Operator nichts synchronisieren, und ohne den
# Operator startet keine Anwendung, die auf ein synchronisiertes Secret wartet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 1.5.1
      helm:
        releaseName: vault-secrets-operator
        valueFiles:
          - $values/gitops/values/vault-secrets-operator/values.yaml
    - repoURL: https://github.com/timkrebs/hashi-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
