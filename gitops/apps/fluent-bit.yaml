# gitops/apps/fluent-bit.yaml
#
# Ships container logs to CloudWatch. Deliberately not to Checkmk: Checkmk
# alerts on patterns in a file an agent can read, it does not store or search
# log history.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-for-fluent-bit
      targetRevision: 0.2.0
      helm:
        releaseName: aws-for-fluent-bit
        valueFiles:
          - $values/gitops/values/fluent-bit/values.yaml
    - repoURL: https://github.com/timkrebs/hashi-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Namespace and service account are created by the platform layer, because
    # the IRSA annotation carries the AWS account ID.
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Deliberately no CreateNamespace: the platform layer owns this namespace
      # and the service account in it, because the IRSA annotation carries the
      # AWS account ID. If Argo CD created it first, Terraform would fail with
      # "namespaces logging already exists". Until the platform layer has run,
      # this Application simply retries.
      - ServerSideApply=true
