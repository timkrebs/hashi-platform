apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sre-overview
  namespace: observability
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Platform
data:
  sre-overview.json: |
