# Server-Zertifikat. Die Raft-Peers erreichen sich ueber den Headless-Service
# vault-internal (vault-0.vault-internal, vault-1...), deshalb muessen diese
# Namen als SAN drin stehen - sonst scheitert retry_join mit auto_join_scheme
# https an der Zertifikatspruefung.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  duration: 8760h     # 1 Jahr
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-ca-issuer
    kind: Issuer
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - "*.vault-internal"
    - "*.vault-internal.vault.svc.cluster.local"
  ipAddresses:
    - 127.0.0.1       # die Health-Probes sprechen den Pod lokal an
