# Vault Enterprise, HA mit integriertem Raft-Storage.
#
# Namespace und ServiceAccount legt der Terraform platform layer an: die
# IRSA-Annotation enthaelt die AWS-Account-ID, die nicht in dieses oeffentliche
# Repo gehoert. Deshalb hier create: false.
global:
  # Ohne das faellt der Chart auf http zurueck und die tls_cert_file-Pfade
  # unten waeren wirkungslos.
  tlsDisable: false

injector:
  enabled: true

# Oeffentlich erreichbare UI/API ueber einen internet-facing NLB.
#
# Der NLB reicht TCP durch, Vault terminiert TLS selbst mit dem cert-manager-
# Zertifikat. Damit bleibt die Verbindung Ende-zu-Ende verschluesselt und es
# wird kein ACM-Zertifikat (und damit keine Domain) gebraucht -- der Browser
# warnt allerdings, weil die CA selbstsigniert ist.
#
# WARNUNG: loadBalancerSourceRanges auf 0.0.0.0/0 stellt die Vault-API der
# gesamten Welt zur Verfuegung. Das Login-Formular und jeder Auth-Endpoint sind
# damit offen fuer Credential Stuffing. Schraenke das auf Office- oder
# VPN-Bereiche ein, sobald das mehr als eine Sandbox ist.
ui:
  enabled: true
  serviceType: LoadBalancer
  externalPort: 8200
  targetPort: 8200
  publishNotReadyAddresses: true
  loadBalancerSourceRanges:
    - 0.0.0.0/0
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip

server:
  image:
    # Enterprise-Image, sonst laedt keine Lizenz. Tag-Schema ist "<version>-ent".
    #
    # Bewusst neuer als die appVersion des Charts (2.0.4): die Lizenz enthaelt
    # das Modul "agentic-iam", das 2.0.4 nicht kennt und mit
    # "licensing could not be initialized: invalid module" abbricht. Lizenzen
    # sind vorwaertsgerichtet - das Binary muss mindestens so neu sein wie die
    # Lizenz, nicht umgekehrt.
    repository: hashicorp/vault-enterprise
    tag: "2.1.1-ent"

  # Das Secret wird ausserhalb von Git angelegt, siehe infra/README.md:
  #   kubectl create secret generic vault-ent-license \
  #     --namespace vault --from-file=license=vault.hclic
  enterpriseLicense:
    secretName: vault-ent-license
    secretKey: license

  serviceAccount:
    create: false
    name: vault

  extraEnvironmentVars:
    VAULT_CACERT: /vault/tls/ca.crt

  volumes:
    - name: tls
      secret:
        secretName: vault-tls
  volumeMounts:
    - name: tls
      mountPath: /vault/tls
      readOnly: true

  # Kontrollierte Upgrades: Pods werden bewusst einzeln von Hand neu gestartet,
  # Standby zuerst, Active zuletzt.
  updateStrategyType: OnDelete

  auditStorage:
    enabled: true

  ha:
    enabled: true
    # Drei statt fuenf: die Pods haben eine harte podAntiAffinity auf Hostname,
    # und der dev-Cluster faehrt aktuell zwei t3.small-Nodes. Bei fuenf blieben
    # drei Pods dauerhaft Pending und Raft bekaeme nie ein Quorum.
    replicas: 3
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/tls/tls.crt"
          tls_key_file    = "/vault/tls/tls.key"
          tls_client_ca_file = "/vault/tls/ca.crt"
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            auto_join        = "provider=k8s namespace=vault label_selector=\"app.kubernetes.io/name=vault,component=server\""
            auto_join_scheme = "https"

            # Ohne diese beiden scheitert der Join an TLS, und der Cluster
            # bleibt bei einem einzigen Peer stehen:
            #
            # leader_ca_cert_file  - der beitretende Knoten prueft das
            #   Zertifikat des Leaders gegen die System-CAs, in denen unsere
            #   cert-manager-CA nicht steht ("certificate signed by unknown
            #   authority"). VAULT_CACERT hilft hier nicht, das gilt nur fuer
            #   die CLI.
            # leader_tls_servername - auto_join findet Peers ueber ihre Pod-IP;
            #   das Zertifikat hat aber nur DNS-SANs, also muss der Name fuer
            #   die Pruefung explizit gesetzt werden.
            leader_ca_cert_file   = "/vault/tls/ca.crt"
            leader_tls_servername = "vault.vault.svc.cluster.local"
          }
        }

        # Auto-Unseal ueber den KMS-Key aus dem Modul vault-aws-prerequisites.
        # Referenziert bewusst den Alias und nicht die Key-ID: der Alias ist
        # deterministisch und ueberlebt ein Neuanlegen der Umgebung.
        seal "awskms" {
          region     = "us-east-1"
          kms_key_id = "alias/hashi-platform-dev-vault-unseal"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "24h"
          disable_hostname          = true
        }
