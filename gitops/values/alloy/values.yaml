# One DaemonSet reading container logs off each node and forwarding them to
# Loki, with the Kubernetes metadata attached so a query can filter by
# namespace, pod or container.

controller:
  type: daemonset

alloy:
  configMap:
    content: |
      // Which pods to read logs from: all of them.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Turn pod metadata into the labels a query filters on. Keeping this
      // list short matters: every distinct label combination is a separate
      // stream in Loki, and high-cardinality labels are what make it slow.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
      }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
