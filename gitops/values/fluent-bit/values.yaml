# The log group itself is created by Terraform with an explicit retention.
# Fluent Bit is deliberately not allowed to create log groups: an auto-created
# one never expires and bills forever.

serviceAccount:
  create: false
  name: aws-for-fluent-bit

cloudWatchLogs:
  enabled: true
  region: us-east-1
  logGroupName: /aws/eks/hashi-platform-dev-cluster/containers
  logStreamPrefix: "fluentbit-"
  # Must stay false: the group belongs to Terraform.
  autoCreateGroup: false

# Only CloudWatch; the other outputs the chart offers stay off.
firehose:
  enabled: false
cloudWatch:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
