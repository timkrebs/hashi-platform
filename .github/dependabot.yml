version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  # Providers and registry modules pinned in the modules, the environment roots
  # and config/.
  - package-ecosystem: terraform
    directories:
      - "/infra/modules/*"
      - "/infra/environments/*/*"
      - "/config/*"
    schedule:
      interval: weekly
    # A major of the AWS stack is not a version bump, it is a migration, and a
    # bot cannot do it: eks 21.x renames every argument this repository passes
    # (cluster_name, cluster_version, cluster_endpoint_public_access,
    # cluster_addons) and drops eks_managed_node_group_defaults outright, while
    # iam 6.x deletes the iam-assumable-role-with-oidc submodule and renames
    # iam-role-for-service-accounts-eks. Four modules have to be rewritten in one
    # change, and the plan has to be read for a forced replacement of the cluster
    # or its node groups -- which would take Vault, Argo CD and the observability
    # stack with it. Unignored, Dependabot reopens the same red pull request
    # every week and the noise trains everyone to ignore it. Minors and patches
    # still flow through the group below. Lift this deliberately, following the
    # checklist under "Upstream module versions" in infra/README.md.
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
      - dependency-name: "terraform-aws-modules/*"
        update-types: ["version-update:semver-major"]
    groups:
      # The AWS provider and the upstream AWS modules have to move together.
      # terraform-aws-modules declare an open lower bound on the provider
      # (eks 20.8.5 says ">= 5.40"), so Terraform will happily install a
      # provider major the module predates -- and then fail on schema that the
      # major removed. eks 20.8.5 with provider 6.x is exactly that: it still
      # uses the elastic_gpu_specifications and elastic_inference_accelerator
      # launch template blocks, which 6.0 dropped. Conversely eks 21.x requires
      # aws >= 6.59, so the module bump cannot land without the provider bump.
      # One group means one coordinated pull request instead of several that
      # each fail on their own.
      aws-stack:
        patterns:
          - "hashicorp/aws"
          - "terraform-aws-modules/*"

      terraform-providers:
        patterns:
          - "hashicorp/*"
        exclude-patterns:
          - "hashicorp/aws"

  # Go-Abhaengigkeiten der Services unter kubernetes/apps/.
  #
  # Ohne diesen Eintrag bekamen sie ueberhaupt keine Updates: die beiden
  # Eintraege oben decken nur Actions und Terraform ab. Aufgefallen ist das
  # erst, als Trivy zwoelf HIGH-Befunde in einem golang.org/x/crypto meldete,
  # das ein Jahr alt war -- obwohl govulncheck schwieg, weil der verwundbare
  # Code (ssh) von diesen Binaries gar nicht erreicht wird.
  #
  # Die Lehre daraus steckt in der Konfiguration: eine eingebettete Modulversion
  # ist unabhaengig davon angreifbar, ob euer Code sie erreicht, und ein
  # Scanner, der das Binary betrachtet, wird sie melden.
  - package-ecosystem: gomod
    directories:
      - "/kubernetes/apps/*"
    schedule:
      interval: weekly
    groups:
      # Die x/-Module von golang.org bewegen sich gemeinsam und haben
      # untereinander enge Anforderungen; einzeln gebumpt erzeugen sie
      # widerspruechliche Pull Requests.
      golang-x:
        patterns:
          - "golang.org/x/*"
