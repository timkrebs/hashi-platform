# Pull requests into an environment branch (dev, staging, production):
#   1. static checks: fmt, tflint, validate, module unit tests
#   2. Sentinel policy tests
#   3. a speculative HCP Terraform plan per layer of that environment, posted
#      on the PR (one comment per layer)
#
# The target branch selects the environment; each environment has two layers:
#   infra/environments/<env>/cluster   workspace hashi-platform-<env>
#   infra/environments/<env>/platform  workspace hashi-platform-<env>-platform
# The platform layer reads the cluster layer's state and talks to the cluster,
# so it is only planned once the cluster workspace holds resources.
# Runs execute remotely in HCP Terraform, so the only secret needed here is
# TF_API_TOKEN (an HCP Terraform team token with plan access to the workspaces).
name: Terraform plan

on:
  pull_request:
    branches: [dev, staging, production]
    paths:
      - "infra/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-*.yml"
      - ".github/actions/**"
      - ".github/scripts/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Newest 1.15.x, matching the "~> 1.15.0" pin in the environment roots and
  # the workspace version in HCP Terraform.
  TERRAFORM_VERSION: "~> 1.15.0"
  TFLINT_VERSION: v0.61.0
  SENTINEL_VERSION: "0.41.0"
  SENTINEL_SHA256: "357ca824c9ac3ab11520a5ad2c2547b34aeb01dd4e3b9f1c7dc325d0be8a9935"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      cluster_ready: ${{ steps.env.outputs.cluster_ready }}
      platform_ready: ${{ steps.env.outputs.platform_ready }}
      cluster_has_state: ${{ steps.cluster_state.outputs.has_state }}
    steps:
      - uses: actions/checkout@v7

      - id: env
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "environment=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          for layer in cluster platform; do
            directory="infra/environments/${TARGET_BRANCH}/${layer}"
            if [ -f "${directory}/main.tf" ]; then
              echo "${layer}_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "${layer}_ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${directory}/main.tf does not exist; the ${layer} layer is skipped for ${TARGET_BRANCH}."
            fi
          done

      # The platform layer can only be planned against a cluster that exists.
      - id: cluster_state
        uses: ./.github/actions/hcp-workspace-state
        with:
          workspace: hashi-platform-${{ github.base_ref }}
          token: ${{ secrets.TF_API_TOKEN }}

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          github_token: ${{ github.token }}

      # Lints the modules and the target environment's layers only, so an
      # environment directory that is still being built out does not block
      # other branches.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          CLUSTER_READY: ${{ needs.resolve.outputs.cluster_ready }}
          PLATFORM_READY: ${{ needs.resolve.outputs.platform_ready }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          for dir in infra/modules/*/; do
            tflint --chdir="${dir}" --config "$PWD/.tflint.hcl" --format compact
          done
          for layer in cluster platform; do
            ready_var="$(echo "${layer}" | tr '[:lower:]' '[:upper:]')_READY"
            if [ "${!ready_var}" = "true" ]; then
              tflint --chdir="infra/environments/${ENVIRONMENT}/${layer}" --config "$PWD/.tflint.hcl" --format compact
            fi
          done

      - name: Validate modules and run unit tests
        run: |
          for module in infra/modules/*/; do
            echo "::group::${module}"
            terraform -chdir="${module}" init -backend=false
            terraform -chdir="${module}" validate
            terraform -chdir="${module}" test
            echo "::endgroup::"
          done

      - name: Validate ${{ needs.resolve.outputs.environment }} layers
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          CLUSTER_READY: ${{ needs.resolve.outputs.cluster_ready }}
          PLATFORM_READY: ${{ needs.resolve.outputs.platform_ready }}
        run: |
          for layer in cluster platform; do
            ready_var="$(echo "${layer}" | tr '[:lower:]' '[:upper:]')_READY"
            if [ "${!ready_var}" = "true" ]; then
              directory="infra/environments/${ENVIRONMENT}/${layer}"
              echo "::group::${directory}"
              terraform -chdir="${directory}" init -backend=false
              terraform -chdir="${directory}" validate
              echo "::endgroup::"
            fi
          done

  # The Sentinel policies in infra/policies gate every run in HCP Terraform, so
  # their own tests run here before a plan is requested.
  policies:
    name: Sentinel policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Sentinel
        run: |
          curl -fsSLo sentinel.zip "https://releases.hashicorp.com/sentinel/${SENTINEL_VERSION}/sentinel_${SENTINEL_VERSION}_linux_amd64.zip"
          echo "${SENTINEL_SHA256}  sentinel.zip" | sha256sum -c -
          unzip -q sentinel.zip -d "${RUNNER_TEMP}/sentinel"
          echo "${RUNNER_TEMP}/sentinel" >> "$GITHUB_PATH"

      - name: sentinel fmt
        working-directory: infra/policies
        run: sentinel fmt -check -write=false ./*.sentinel ./testdata/*.sentinel

      - name: sentinel test
        working-directory: infra/policies
        run: sentinel test -verbose

  plan:
    name: Plan ${{ needs.resolve.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [resolve, checks, policies]
    if: needs.resolve.outputs.cluster_ready == 'true' || needs.resolve.outputs.platform_ready == 'true'
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # Without -out these are speculative plans: HCP Terraform records them
      # but they can never be applied.
      - name: Plan cluster layer
        id: plan_cluster
        if: needs.resolve.outputs.cluster_ready == 'true'
        working-directory: infra/environments/${{ needs.resolve.outputs.environment }}/cluster
        run: |
          terraform init
          terraform plan -no-color -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee plan.txt

      - name: Cluster plan report
        if: always() && steps.plan_cluster.outcome != 'skipped'
        env:
          LAYER: cluster
          PLAN_OUTCOME: ${{ steps.plan_cluster.outcome }}
        working-directory: infra/environments/${{ needs.resolve.outputs.environment }}/cluster
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/plan-report.sh" plan.txt "${GITHUB_WORKSPACE}/plan-report-cluster.md"

      - name: Plan platform layer
        id: plan_platform
        if: always() && needs.resolve.outputs.platform_ready == 'true' && needs.resolve.outputs.cluster_has_state == 'true' && steps.plan_cluster.outcome != 'failure'
        working-directory: infra/environments/${{ needs.resolve.outputs.environment }}/platform
        run: |
          terraform init
          terraform plan -no-color -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee plan.txt

      - name: Platform plan report
        if: always() && steps.plan_platform.outcome != 'skipped'
        env:
          LAYER: platform
          PLAN_OUTCOME: ${{ steps.plan_platform.outcome }}
        working-directory: infra/environments/${{ needs.resolve.outputs.environment }}/platform
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/plan-report.sh" plan.txt "${GITHUB_WORKSPACE}/plan-report-platform.md"

      - name: Note skipped platform plan
        if: needs.resolve.outputs.platform_ready == 'true' && needs.resolve.outputs.cluster_has_state != 'true'
        run: |
          echo "::notice::Platform layer not planned: workspace hashi-platform-${ENVIRONMENT} holds no resources yet. Apply the cluster layer first."
          echo "### ⏭️ Platform plan for \`${ENVIRONMENT}\` skipped: the cluster workspace holds no resources yet." >> "$GITHUB_STEP_SUMMARY"

      # One comment per layer, updated in place on every push.
      - name: Comment on pull request
        if: always()
        uses: actions/github-script@v9
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            for (const layer of ['cluster', 'platform']) {
              const path = `plan-report-${layer}.md`;
              if (!fs.existsSync(path)) continue;
              const body = fs.readFileSync(path, 'utf8');
              const marker = `<!-- terraform-plan:${process.env.ENVIRONMENT}:${layer} -->`;
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }
