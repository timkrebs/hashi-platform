# Pushes to an environment branch (dev, staging, production):
#   1. plan the cluster layer in HCP Terraform and save the plan
#   2. behind the GitHub environment's protection rules (required reviewers
#      on staging and production): apply that exact saved plan, then plan and
#      apply the platform layer in the same approved job
#
# Each environment has two layers:
#   infra/environments/<env>/cluster   workspace hashi-platform-<env>
#   infra/environments/<env>/platform  workspace hashi-platform-<env>-platform
# The platform layer never uses a saved plan: its Kubernetes token is only
# valid for about 15 minutes and would expire while a reviewer waits. It is
# planned and applied back to back once the cluster layer is in place.
# Nothing is applied when a layer reports no changes. `workflow_dispatch`
# re-runs the same flow for the branch it is started from.
name: Terraform apply

on:
  push:
    branches: [dev, staging, production]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

# One deploy per environment at a time; queued pushes wait instead of racing.
concurrency:
  group: terraform-apply-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "~> 1.15.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      cluster_ready: ${{ steps.env.outputs.cluster_ready }}
      platform_ready: ${{ steps.env.outputs.platform_ready }}
    steps:
      - uses: actions/checkout@v7

      - id: env
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "${BRANCH}" in
            dev|staging|production) ;;
            *)
              echo "::error::Start this workflow from dev, staging or production, not '${BRANCH}'."
              exit 1
              ;;
          esac
          echo "environment=${BRANCH}" >> "$GITHUB_OUTPUT"
          for layer in cluster platform; do
            directory="infra/environments/${BRANCH}/${layer}"
            if [ -f "${directory}/main.tf" ]; then
              echo "${layer}_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "${layer}_ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${directory}/main.tf does not exist; the ${layer} layer is skipped for ${BRANCH}."
            fi
          done

  plan:
    name: Plan ${{ needs.resolve.outputs.environment }} cluster
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.cluster_ready == 'true'
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      run_url: ${{ steps.plan.outputs.run_url }}
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    defaults:
      run:
        working-directory: infra/environments/${{ needs.resolve.outputs.environment }}/cluster
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform init

      # -out creates a real (applyable) run in HCP Terraform; the local tfplan
      # file is only a reference to it. -detailed-exitcode returns 2 when the
      # plan contains changes, which is what gates the cluster apply.
      - name: Plan and save
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' plan.txt | head -n 1 || true)
          status_line=$(grep -E '^(Plan:|No changes\.|Error:)' plan.txt | head -n 1 || true)
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"

          case "${exit_code}" in
            0) changes=false ;;
            2) changes=true ;;
            *) changes=false ;;
          esac
          echo "changes=${changes}" >> "$GITHUB_OUTPUT"

          {
            echo "### Terraform plan for \`${ENVIRONMENT}\` / \`cluster\`"
            echo
            echo "**${status_line:-Plan exited with code ${exit_code}}**"
            if [ -n "${run_url}" ]; then
              echo
              echo "HCP Terraform run: ${run_url}"
            fi
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${exit_code}" != "0" ] && [ "${exit_code}" != "2" ]; then
            exit "${exit_code}"
          fi

      - name: Upload saved plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ needs.resolve.outputs.environment }}-cluster-${{ github.sha }}
          path: infra/environments/${{ needs.resolve.outputs.environment }}/cluster/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply ${{ needs.resolve.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [resolve, plan]
    # Runs when the cluster layer has changes or the platform layer exists;
    # the platform steps then decide for themselves whether anything changed.
    if: needs.plan.result == 'success' && (needs.plan.outputs.changes == 'true' || needs.resolve.outputs.platform_ready == 'true')
    # Protection rules (required reviewers, wait timers) are configured on the
    # GitHub environment of the same name. Rejecting here leaves the HCP run in
    # "planned and saved"; discard it in the HCP Terraform UI.
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ needs.plan.outputs.run_url }}
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      CLUSTER_DIR: infra/environments/${{ needs.resolve.outputs.environment }}/cluster
      PLATFORM_DIR: infra/environments/${{ needs.resolve.outputs.environment }}/platform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # ---- cluster layer: apply exactly the saved plan -----------------------
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.changes == 'true'
        with:
          name: tfplan-${{ needs.resolve.outputs.environment }}-cluster-${{ github.sha }}
          path: ${{ env.CLUSTER_DIR }}

      - name: Apply cluster layer
        if: needs.plan.outputs.changes == 'true'
        working-directory: ${{ env.CLUSTER_DIR }}
        run: |
          terraform init
          terraform apply -no-color tfplan 2>&1 | tee apply.txt
          {
            echo "### Terraform apply for \`${ENVIRONMENT}\` / \`cluster\`"
            echo
            echo "**$(grep -E '^(Apply complete!|Error:)' apply.txt | head -n 1 || echo 'See output below')**"
            echo
            echo "<details><summary>Apply output</summary>"
            echo
            echo '```text'
            cat apply.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- platform layer: fresh plan, then apply if it has changes -----------
      - name: Plan platform layer
        id: plan_platform
        if: needs.resolve.outputs.platform_ready == 'true'
        working-directory: ${{ env.PLATFORM_DIR }}
        run: |
          terraform init
          set +e
          terraform plan -no-color -detailed-exitcode -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' plan.txt | head -n 1 || true)
          status_line=$(grep -E '^(Plan:|No changes\.|Error:)' plan.txt | head -n 1 || true)
          case "${exit_code}" in
            0) changes=false ;;
            2) changes=true ;;
            *) changes=false ;;
          esac
          echo "changes=${changes}" >> "$GITHUB_OUTPUT"

          {
            echo "### Terraform plan for \`${ENVIRONMENT}\` / \`platform\`"
            echo
            echo "**${status_line:-Plan exited with code ${exit_code}}**"
            if [ -n "${run_url}" ]; then
              echo
              echo "HCP Terraform run: ${run_url}"
            fi
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${exit_code}" != "0" ] && [ "${exit_code}" != "2" ]; then
            exit "${exit_code}"
          fi

      - name: Apply platform layer
        if: needs.resolve.outputs.platform_ready == 'true' && steps.plan_platform.outputs.changes == 'true'
        working-directory: ${{ env.PLATFORM_DIR }}
        run: |
          terraform apply -no-color -auto-approve -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee apply.txt
          {
            echo "### Terraform apply for \`${ENVIRONMENT}\` / \`platform\`"
            echo
            echo "**$(grep -E '^(Apply complete!|Error:)' apply.txt | head -n 1 || echo 'See output below')**"
            echo
            echo "<details><summary>Apply output</summary>"
            echo
            echo '```text'
            cat apply.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
