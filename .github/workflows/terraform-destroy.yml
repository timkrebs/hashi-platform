# Tears down the dev environment in HCP Terraform, platform layer first, then
# the cluster layer.
#
# Manual only: "Run workflow", then type `dev` to confirm. There is one
# environment, so no promotion flow can trigger a teardown by itself.
#
# The destroy job is bound to the "dev" GitHub environment, so any protection
# rules configured there gate it, and it shares terraform.yml's
# concurrency group, so a push that lands during the destroy queues behind it
# and recreates the environment afterwards.
#
# Order matters: the platform layer is destroyed first, so the AWS objects
# in-cluster workloads created (NLBs, EBS volumes) can still be cleaned up
# while the load balancer controller runs. If the platform destroy fails, the
# job stops and the cluster is left in place.
#
# HCP Terraform additionally destroys the workspaces once they go idle
# (auto-destroy-activity-duration: platform 1d, cluster 2d).
name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "dev" to confirm the teardown
        type: string
        required: true
      layer:
        description: Which layers to destroy
        type: choice
        required: false
        default: all
        options: [all, platform]

permissions:
  contents: read

env:
  ENVIRONMENT: dev
  CLUSTER_DIR: infra/environments/dev/cluster
  PLATFORM_DIR: infra/environments/dev/platform
  TERRAFORM_VERSION: "~> 1.15.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Destroy dev
    runs-on: ubuntu-latest
    environment:
      name: dev
    # Must match the group in terraform.yml, or a destroy could run at the same
    # time as an apply against the same workspaces.
    concurrency:
      group: terraform-main
      cancel-in-progress: false
    env:
      LAYER_SELECTION: ${{ inputs.layer || 'all' }}
    steps:
      - name: Check confirmation
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${INPUT_CONFIRM}" != "${ENVIRONMENT}" ]; then
            echo "::error::Confirmation '${INPUT_CONFIRM}' does not match '${ENVIRONMENT}'."
            exit 1
          fi

      - uses: actions/checkout@v7

      - id: config
        name: Check configuration
        run: |
          for layer in cluster platform; do
            directory="infra/environments/${ENVIRONMENT}/${layer}"
            if [ -f "${directory}/main.tf" ]; then
              echo "${layer}_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "${layer}_ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${directory}/main.tf does not exist; the ${layer} layer is skipped."
            fi
          done

      # The platform layer talks to the cluster while it is destroyed; without
      # a cluster its Kubernetes resources cannot be removed cleanly.
      - id: cluster_state
        uses: ./.github/actions/hcp-workspace-state
        with:
          workspace: hashi-platform-${{ env.ENVIRONMENT }}
          token: ${{ secrets.TF_API_TOKEN }}

      - uses: hashicorp/setup-terraform@v4
        if: steps.config.outputs.cluster_ready == 'true' || steps.config.outputs.platform_ready == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # ---- platform layer first ------------------------------------------------
      - name: Destroy platform layer
        if: steps.config.outputs.platform_ready == 'true' && steps.cluster_state.outputs.has_state == 'true'
        working-directory: ${{ env.PLATFORM_DIR }}
        run: |
          terraform init
          terraform destroy -auto-approve -no-color -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee "${GITHUB_WORKSPACE}/destroy-platform.txt"

      - name: Note skipped platform destroy
        if: steps.config.outputs.platform_ready == 'true' && steps.cluster_state.outputs.has_state != 'true'
        run: |
          echo "::warning::Platform layer not destroyed: workspace hashi-platform-${ENVIRONMENT} holds no resources, so there is no cluster to talk to. If hashi-platform-${ENVIRONMENT}-platform still holds state, remove its Kubernetes and Helm resources with 'terraform state rm' and destroy the remaining AWS resources by hand."

      # ---- then the cluster layer (only if everything above succeeded) ---------
      - name: Destroy cluster layer
        if: steps.config.outputs.cluster_ready == 'true' && env.LAYER_SELECTION == 'all'
        working-directory: ${{ env.CLUSTER_DIR }}
        run: |
          terraform init
          terraform destroy -auto-approve -no-color -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee "${GITHUB_WORKSPACE}/destroy-cluster.txt"

      - name: Destroy summary
        if: always()
        run: |
          for layer in platform cluster; do
            file="destroy-${layer}.txt"
            [ -f "${file}" ] || continue
            status_line=$(grep -E '^(Destroy complete!|Apply complete!|No changes\.|Error:)' "${file}" | head -n 1 || true)
            run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' "${file}" | head -n 1 || true)
            {
              echo "### Terraform destroy for \`${ENVIRONMENT}\` / \`${layer}\`"
              echo
              echo "**${status_line:-See output below}**"
              if [ -n "${run_url}" ]; then
                echo
                echo "HCP Terraform run: ${run_url}"
              fi
              echo
              echo "<details><summary>Destroy output</summary>"
              echo
              echo '```text'
              cat "${file}"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
