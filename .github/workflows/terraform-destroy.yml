# Tears down an ephemeral environment (dev or staging) in HCP Terraform,
# platform layer first, then the cluster layer.
#
# Runs automatically when a promotion pull request is merged:
#   dev     -> staging      destroys dev
#   staging -> production   destroys staging
# and on demand through "Run workflow" for dev or staging. Production is never
# a target.
#
# The destroy job is bound to the GitHub environment of the branch being
# destroyed, so staging's required reviewers gate it, and it shares the apply
# workflow's concurrency group, so a push that lands during the destroy queues
# behind it and recreates the environment afterwards.
#
# Order matters: the platform layer removes Argo CD's workloads and the AWS
# objects they created while the load balancer controller still runs. If the
# platform destroy fails, the job stops and the cluster is left in place.
#
# HCP Terraform additionally destroys idle dev and staging workspaces
# (auto-destroy-activity-duration: platform 1d, cluster 2d).
name: Terraform destroy

on:
  pull_request:
    types: [closed]
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        required: true
        options: [dev, staging]
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true
      layer:
        description: Which layers to destroy
        type: choice
        required: false
        default: all
        options: [all, platform]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "~> 1.15.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          environment=""
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_CONFIRM}" != "${INPUT_ENVIRONMENT}" ]; then
              echo "::error::Confirmation '${INPUT_CONFIRM}' does not match the environment '${INPUT_ENVIRONMENT}'."
              exit 1
            fi
            environment="${INPUT_ENVIRONMENT}"
          elif [ "${MERGED}" = "true" ] && [ "${HEAD_REPO}" = "${THIS_REPO}" ]; then
            case "${BASE_REF}:${HEAD_REF}" in
              staging:dev)        environment="dev" ;;
              production:staging) environment="staging" ;;
            esac
          fi

          case "${environment}" in
            dev|staging)
              echo "Promotion detected; ${environment} will be destroyed."
              ;;
            "")
              echo "::notice::Not a promotion merge (${HEAD_REF} -> ${BASE_REF}); nothing to destroy."
              ;;
            *)
              echo "::error::Refusing to destroy '${environment}'."
              exit 1
              ;;
          esac
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"

  destroy:
    name: Destroy ${{ needs.resolve.outputs.environment }}
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.environment != ''
    environment:
      name: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: terraform-apply-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      CLUSTER_DIR: infra/environments/${{ needs.resolve.outputs.environment }}/cluster
      PLATFORM_DIR: infra/environments/${{ needs.resolve.outputs.environment }}/platform
      LAYER_SELECTION: ${{ inputs.layer || 'all' }}
    steps:
      # Destroy with the configuration that was applied: the environment's own branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.environment }}

      - id: config
        name: Check configuration
        run: |
          for layer in cluster platform; do
            directory="infra/environments/${ENVIRONMENT}/${layer}"
            if [ -f "${directory}/main.tf" ]; then
              echo "${layer}_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "${layer}_ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${directory}/main.tf does not exist on branch ${ENVIRONMENT}; the ${layer} layer is skipped."
            fi
          done

      # The platform layer talks to the cluster while it is destroyed; without
      # a cluster its Kubernetes resources cannot be removed cleanly.
      - id: cluster_state
        uses: ./.github/actions/hcp-workspace-state
        with:
          workspace: hashi-platform-${{ needs.resolve.outputs.environment }}
          token: ${{ secrets.TF_API_TOKEN }}

      - uses: hashicorp/setup-terraform@v4
        if: steps.config.outputs.cluster_ready == 'true' || steps.config.outputs.platform_ready == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # ---- platform layer first ------------------------------------------------
      - name: Destroy platform layer
        if: steps.config.outputs.platform_ready == 'true' && steps.cluster_state.outputs.has_state == 'true'
        working-directory: ${{ env.PLATFORM_DIR }}
        run: |
          terraform init
          terraform destroy -auto-approve -no-color -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee "${GITHUB_WORKSPACE}/destroy-platform.txt"

      - name: Note skipped platform destroy
        if: steps.config.outputs.platform_ready == 'true' && steps.cluster_state.outputs.has_state != 'true'
        run: |
          echo "::warning::Platform layer not destroyed: workspace hashi-platform-${ENVIRONMENT} holds no resources, so there is no cluster to talk to. If hashi-platform-${ENVIRONMENT}-platform still holds state, remove its Kubernetes and Helm resources with 'terraform state rm' and destroy the remaining AWS resources by hand."

      # ---- then the cluster layer (only if everything above succeeded) ---------
      - name: Destroy cluster layer
        if: steps.config.outputs.cluster_ready == 'true' && env.LAYER_SELECTION == 'all'
        working-directory: ${{ env.CLUSTER_DIR }}
        run: |
          terraform init
          terraform destroy -auto-approve -no-color -var-file="${ENVIRONMENT}.tfvars" 2>&1 | tee "${GITHUB_WORKSPACE}/destroy-cluster.txt"

      - name: Destroy summary
        if: always()
        run: |
          for layer in platform cluster; do
            file="destroy-${layer}.txt"
            [ -f "${file}" ] || continue
            status_line=$(grep -E '^(Destroy complete!|Apply complete!|No changes\.|Error:)' "${file}" | head -n 1 || true)
            run_url=$(grep -Eo 'https://app\.terraform\.io/app/[^[:space:]]+' "${file}" | head -n 1 || true)
            {
              echo "### Terraform destroy for \`${ENVIRONMENT}\` / \`${layer}\`"
              echo
              echo "**${status_line:-See output below}**"
              if [ -n "${run_url}" ]; then
                echo
                echo "HCP Terraform run: ${run_url}"
              fi
              echo
              echo "<details><summary>Destroy output</summary>"
              echo
              echo '```text'
              cat "${file}"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
