# This ServiceAccount IS the service's identity in Vault. The Kubernetes auth
# role in config/vault/kubernetes-auth.tf binds exactly this name in exactly
# this namespace -- rename either and Vault login fails with "permission
# denied" and nothing more specific.
#
# automountServiceAccountToken stays on: the Vault Agent needs the projected
# token to authenticate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: auth-service
