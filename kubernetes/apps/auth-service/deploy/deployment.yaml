apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: identity
spec:
  # Vorlaeufig 0. Der Service kann derzeit nicht starten: er wartet auf
  # /vault/secrets/token, der Vault Agent Injector setzt aber gar kein Sidecar,
  # und in Vault existiert kein kubernetes-Auth-Backend -- `vault auth list`
  # zeigt nur token/ und userpass/. Die Readiness-Probe antwortete darum ueber
  # zwei Tage lang mit 503, rund 48.000 Mal.
  #
  # Zwei Gruende, ihn nicht einfach laufen zu lassen: er belegte drei Pod-Slots
  # ohne je bereit zu werden, und seine PodDisruptionBudget stand bei
  # currentHealthy=0 auf disruptionsAllowed=0 -- damit haette jedes
  # Node-Draining blockiert.
  #
  # Zurueck auf 2, sobald config/vault/ das Kubernetes-Auth-Backend, die Rolle
  # auth-service und die passende Policy im Namespace hp-dev-backend hat.
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: identity
    spec:
      serviceAccountName: auth-service
      # Longer than SHUTDOWN_GRACE (20s) so in-flight requests finish before
      # SIGKILL. Equal or shorter would make the grace period decorative.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: auth-service
      containers:
        - name: auth-service
          image: ghcr.io/timkrebs/auth-service:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: ":8080"
            # Das Verzeichnis, in das der VaultStaticSecret gemountet wird.
            # Alles Weitere kommt aus den Dateien darin.
            - name: SECRETS_DIR
              value: /etc/auth-service/secrets
            - name: TOKEN_ISSUER
              value: https://auth-service.auth-service.svc.cluster.local
            - name: TOKEN_AUDIENCE
              value: hashi-platform
            # Short, because a JWT cannot be revoked once issued. Fifteen
            # minutes bounds the damage of a leaked token.
            - name: TOKEN_TTL
              value: 15m
            - name: SHUTDOWN_GRACE
              value: 20s
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: secrets
              mountPath: /etc/auth-service/secrets
              readOnly: true
          # Probes hit the admin port, which is never published outside the
          # cluster. Liveness deliberately does not touch Vault.
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 3
          # The Vault Agent has to log in before the first readiness check can
          # succeed; without this the pod is killed mid-startup.
          startupProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: secrets
          secret:
            # Wird vom Vault Secrets Operator angelegt, nicht von uns.
            # optional: true ist wichtig -- ohne das bleibt der Pod in
            # ContainerCreating haengen, bis der Operator synchronisiert hat,
            # und der wahre Grund steht nur in den Events. So startet der Pod,
            # meldet sich ueber /readyz als nicht bereit und sagt im Log, worauf
            # er wartet.
            secretName: auth-service-secrets
            optional: true
            defaultMode: 0400
