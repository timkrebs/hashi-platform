---
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-dev
  namespace: rabbitmq
spec:
  replicas: 3

  # Keine Credentials hier. Der Operator erzeugt das Secret
  # rabbitmq-dev-default-user mit einem Zufallspasswort; das ist die einzige
  # Quelle. default_user/default_pass in additionalConfig zu setzen wuerde
  # dagegen arbeiten -- und dieses Repo ist oeffentlich.
  #
  # Auslesen:
  #   kubectl -n rabbitmq get secret rabbitmq-dev-default-user \
  #     -o jsonpath='{.data.username}' | base64 -d
  #   kubectl -n rabbitmq get secret rabbitmq-dev-default-user \
  #     -o jsonpath='{.data.password}' | base64 -d

  # Der Default des Operators ist 1 CPU / 2 GiB *pro Pod*. Der dev-Cluster
  # faehrt fuenf t3.medium (2 CPU / ~3,7 GiB allocatable), auf denen schon
  # Vault, Argo CD, Prometheus, Loki und Alloy liegen -- bei 2 GiB requests
  # passen die drei Replicas nur noch auf genau drei Nodes, ohne Reserve.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi

  persistence:
    # Default StorageClass ist gp3 (verschluesselt, ebs.csi.aws.com), vom
    # Terraform platform layer angelegt. Bewusst nicht gesetzt, damit ein
    # Rebuild der Umgebung nicht an einem harten Namen haengt.
    storage: 10Gi

  # Ohne das koennen alle drei Replicas auf einem Node landen und ein einzelner
  # Node-Ausfall nimmt das Quorum mit. "preferred", nicht "required": bei fuenf
  # Nodes soll ein Rescheduling nicht daran scheitern.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: rabbitmq-dev

  service:
    # ClusterIP, nicht NodePort/LoadBalancer: dieser Service buendelt AMQP
    # (5672) mit der Management-UI (15672). Ihn oeffentlich zu machen wuerde
    # den Message-Broker selbst ins Internet stellen. Die UI bekommt einen
    # eigenen Service, der nur 15672 veroeffentlicht -- siehe
    # rabbitmq-management-lb.yaml.
    type: ClusterIP
